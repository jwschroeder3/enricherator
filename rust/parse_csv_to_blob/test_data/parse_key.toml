[input]
expt_key_file = "expt_key.json"
draws_file = "draws.csv"
pos_file_name = "position_map.tsv"

[output]
out_direc = "out_direc"

[parse]
vars = ["Alpha", "Beta", "Gamma", "non_sub"]
threshold = 1.0

[geno_contrast]
Beta = ["vpsR-wt", "vpsT-wt", "vpsR - wt -vpsT + wt"]
Gamma = ["vpsR-wt", "vpsT-wt"]
threshold = 0.0

[strand_contrast]
Gamma = ["plus-minus"]
non_sub = ["minus - plus"]
